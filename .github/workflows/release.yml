name: Release

# Push to the "release" branch (or push a tag like v1.7.0) to build the app and publish it
# as a GitHub release. The version comes from Sources/PSXCore/Version.swift; a version that
# already has a release is skipped.
on:
  push:
    branches: [release]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the runner
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Build (Apple Silicon + Intel)
        run: UNIVERSAL=1 ZIP=1 ./build_app.sh

      - name: Check the build
        run: |
          lipo -info build/PSXPackager.app/Contents/MacOS/PSXPackagerGUI
          build/PSXPackager.app/Contents/Helpers/psxpackager --version
          codesign --verify --deep --strict build/PSXPackager.app
          ! grep -rlaE "/Users/" build/PSXPackager.app

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(build/PSXPackager.app/Contents/Helpers/psxpackager --version | head -1 | awk '{print $NF}')
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump the version in Sources/PSXCore/Version.swift to publish a new one."
            exit 0
          fi
          SHA=$(shasum -a 256 build/PSXPackager-macOS.zip | cut -d' ' -f1)
          sed "s/{{SHA256}}/$SHA/" .github/release-notes.md > notes.md
          gh release create "$TAG" build/PSXPackager-macOS.zip --target "$GITHUB_SHA" \
            --title "PSXPackager for macOS $VERSION" --notes-file notes.md

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PSXPackager-macOS
          path: build/PSXPackager-macOS.zip
